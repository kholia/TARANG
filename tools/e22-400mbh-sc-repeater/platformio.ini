[platformio]
default_envs = e22-400mbh-sc

[env:e22-400mbh-sc]
platform = platformio/ststm32@19.7.0
platform_packages =
  platformio/framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32/archive/2.12.0.zip
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC_WITHOUT_SERIAL
  -DUSBD_ATTACH_PIN=PB5
  -DUSBD_ATTACH_LEVEL=HIGH
  -DRADIOLIB_EXCLUDE_CC1101=1
  -DRADIOLIB_EXCLUDE_NRF24=1
  -DRADIOLIB_EXCLUDE_RF69=1
  -DRADIOLIB_EXCLUDE_SX1231=1
  -DRADIOLIB_EXCLUDE_SX1233=1
  -DRADIOLIB_EXCLUDE_SI443X=1
  -DRADIOLIB_EXCLUDE_RFM2X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DRADIOLIB_EXCLUDE_AFSK=1
  -DRADIOLIB_EXCLUDE_BELL=1
  -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -DRADIOLIB_EXCLUDE_MORSE=1
  -DRADIOLIB_EXCLUDE_RTTY=1
  -DRADIOLIB_EXCLUDE_SSTV=1
  -DRADIOLIB_EXCLUDE_AX25=1
  -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
  -DRADIOLIB_EXCLUDE_PAGER=1
  -DRADIOLIB_EXCLUDE_FSK4=1
  -DRADIOLIB_EXCLUDE_APRS=1
  -DRADIOLIB_EXCLUDE_ADSB=1
  -DRADIOLIB_EXCLUDE_LORAWAN=1
lib_deps =
  https://github.com/jgromes/RadioLib/archive/10e7925db2727e1f5c1c796191905d0a7d955eec.zip

[env:e22-400mbh-sc-rx-only]
extends = env:e22-400mbh-sc
build_flags =
  ${env:e22-400mbh-sc.build_flags}
  -DREPEATER_RX_ONLY
